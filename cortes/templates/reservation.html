{% extends "base.html" %}
{% load static %}
{% block stylesheet %}
<style>
    .container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
    }
    .room {
        border: 1px solid #ccc;
        padding: 10px;
        width: 300px;
        text-align: center;
    }
    .room img {
        width: 100%;
        height: auto;
    }
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        justify-content: center;
        align-items: center;
    }
    .modal-content {
        background: #fff;
        padding: 20px;
        width: 400px;
        border-radius: 5px;
        text-align: center;
    }
    .close-button {
        float: right;
        cursor: pointer;
        font-size: 20px;
        color: red;
    }
</style>
{% endblock %}

{% block script %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const modal = document.getElementById('reservation-modal');
        const closeButton = modal.querySelector('.close-button');
        const roomImage = document.getElementById('modal-room-image');
        const roomIdInput = document.getElementById('room-id');

        document.querySelectorAll('.reserve-button').forEach(button => {
            button.addEventListener('click', () => {
                const roomId = button.getAttribute('data-room-id');
                const roomImageSrc = button.getAttribute('data-room-image');

                roomImage.src = roomImageSrc;
                roomIdInput.value = roomId;

                modal.style.display = 'flex';
            });
        });

        closeButton.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    });
</script>
{% endblock %}

{% block content %}
<section id="about" class="about">
<div class="container">
    {% for image in gallery_images %}
    <div class="col-lg-3 col-md-4">
        <div class="gallery-item">
            <a href="#" class="reserve-button"
               data-room-id="{{ image.id }}"
               data-room-image="{% static image.url %}">
                <img src="{% static image.url %}" alt="{{ image.alt }}" class="img-fluid">
            </a>
        </div>
    </div>
    {% endfor %}

    <!-- Modal -->
    <div class="modal" id="reservation-modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Réserver une chambre</h2>
            <img id="modal-room-image" src="" alt="Image de la chambre">

            {% if reservation or apartment %}
            <form id="reservation-form" method="POST" action="{% url 'payment' reservation.id apartment.id %}">
            {% else %}
            <form id="reservation-form" method="POST" action="#">
            {% endif %}
                {% csrf_token %}
                <input type="hidden" name="room_id" id="room-id">
                <label for="name">Nom :</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" required>

                <label for="dates">Dates :</label>
                <input type="date" id="dates" name="dates" required>

                <button type="submit">Confirmer la réservation</button>
            </form>
        </div>
    </div>
</div>
    </section>
{% endblock %}
